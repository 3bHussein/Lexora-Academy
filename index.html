<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#121a32"><title>Lexora Academy | Russian A1 & A2</title><style>
:root{font-family:system-ui,"Segoe UI",sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0c1326;color:#eef2ff}header{padding:24px;background:#17213c;border-bottom:1px solid #344263}h1{margin:0;color:#89e8d0}small{color:#b4bed1}.layout{max-width:1100px;margin:auto;padding:22px;display:grid;grid-template-columns:275px 1fr;gap:20px}aside,main{border:1px solid #344263;background:#151f38;border-radius:18px;padding:20px}button{cursor:pointer;color:#fff;background:#283958;border:1px solid #405479;border-radius:10px;padding:11px 15px}button:hover,button.active{background:#287d75}nav button{display:block;width:100%;text-align:right;margin:8px 0}aside>button{display:block;width:100%;text-align:right;margin:7px 0}button{max-width:100%;overflow-wrap:anywhere}main,aside,.example{min-width:0;overflow-wrap:anywhere}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #89e8d0;outline-offset:3px}.ru{font-size:1.45rem;direction:ltr;text-align:left;color:#acf4db}.example{background:#202e4a;border-radius:12px;padding:15px;margin:12px 0}.example p{margin:7px 0}input{width:100%;padding:12px;background:#0e172d;color:white;border:1px solid #52617c;border-radius:9px}.ok{color:#7ce2aa}.bad{color:#ffaeae}.meta{color:#b8c4dc}progress{width:100%}@media(max-width:720px){.layout{grid-template-columns:1fr}header{padding:18px}} </style></head>
<body><header><h1>LEXORA <span style="color:white">ACADEMY</span></h1><small>الروسية • المستويان A1 وA2 • تعلم وتدرب واستمع</small></header><div class="layout"><aside><h2>الدروس</h2><progress id="progress" value="0" max="12"></progress><p id="summary"></p><nav id="nav"></nav><hr><button id="dashboardTab" type="button">📊 لوحة التقدم</button><button id="readingTab" type="button">📖 مختبر القراءة A1</button><button id="lessonsTab" type="button">📚 دروس A1</button><button id="a2Tab" type="button">🚀 دروس A2</button><button id="a2ReadingTab" type="button">📖 قراءة A2</button><button id="a2DialoguesTab" type="button">💬 محادثات A2</button><button id="a2ExamTab" type="button">📝 اختبار A2</button><button id="a2ListeningTab" type="button">🎧 استماع A2</button></aside><main id="lesson"></main></div>
<script src="neural-audio.js"></script><script src="a2-neural-audio.js"></script><script src="curriculum/a1-notes.js"></script><script src="curriculum/a1-reading.js"></script><script src="curriculum/a2-lessons.js"></script><script src="curriculum/a2-reading.js"></script><script src="curriculum/a2-dialogues.js"></script><script src="curriculum/a2-exam.js"></script><script src="curriculum/a2-listening.js"></script><script>
const lessons=[
["التحية والتعارف","Привет!","مرحبًا!","Здравствуйте!","أهلًا (رسميًا)","اختر التحية الرسمية","Здравствуйте!","Привет!"],
["الأسماء والتقديم","Меня зовут Анна.","اسمي آنا","Как вас зовут?","ما اسم حضرتك؟","كيف تقول: اسمي آنا؟","Меня зовут Анна.","До свидания."],
["الشكر والاعتذار","Спасибо!","شكرًا!","Извините.","اعذرني / آسف","ما معنى شكرًا؟","Спасибо!","Извините."],
["نعم ولا","Да.","نعم","Нет.","لا","ما معنى لا؟","Нет.","Да."],
["الضمائر","Я студент.","أنا طالب","Вы инженер.","حضرتك مهندس","أي ضمير يعني أنا؟","Я","Вы"],
["البلدان واللغات","Я из Египта.","أنا من مصر","Я говорю по-русски.","أنا أتحدث الروسية","كيف تقول: أنا من مصر؟","Я из Египта.","Я из России."],
["الأرقام الأساسية","Один, два, три.","واحد، اثنان، ثلاثة","Десять.","عشرة","ما معنى عشرة؟","Десять.","Один."],
["الأسئلة البسيطة","Где метро?","أين المترو؟","Что это?","ما هذا؟","كيف تسأل أين المترو؟","Где метро?","Что это?"],
["العائلة","Это моя мама.","هذه أمي","Это мой брат.","هذا أخي","ما معنى هذا أخي؟","Это мой брат.","Это моя мама."],
["الطعام والطلب","Я хочу чай.","أريد شايًا","Можно воду?","هل يمكن ماء؟","كيف تطلب الشاي؟","Я хочу чай.","Я хочу кофе."],
["الوقت واليوم","Сегодня понедельник.","اليوم الاثنين","Сейчас два часа.","الساعة الآن الثانية","ما معنى اليوم؟","Сегодня","Вчера"],
["التسوق والسعر","Сколько это стоит?","بكم هذا؟","Это дорого.","هذا غالٍ","كيف تسأل عن السعر؟","Сколько это стоит?","Где метро?"]
];
const nav=document.querySelector("#nav"),main=document.querySelector("#lesson");let readingDone;try{readingDone=new Set(JSON.parse(localStorage.getItem("lexoraA1reading")||"[]"))}catch{readingDone=new Set()};let current=0,done;try{done=new Set(JSON.parse(localStorage.getItem("lexoraA1done")||"[]"))}catch{done=new Set()}
function draw(){nav.innerHTML="";lessons.forEach((l,i)=>{let b=document.createElement("button");b.textContent=(done.has(i)?"✓ ":"")+(i+1)+". "+l[0];b.className=i===current?"active":"";b.onclick=()=>{current=i;draw()};nav.append(b)});document.querySelector("#progress").value=done.size;document.querySelector("#summary").textContent=done.size+" من 12 درسًا مكتملًا";let l=lessons[current];main.innerHTML="<p class=meta>Russian / A1 / Lesson "+(current+1)+"</p><h2>"+l[0]+"</h2><p>اقرأ الأمثلة، افهم الترجمة، ثم حل سؤال المراجعة.</p><section class=example><p class=ru>"+l[1]+"</p><p>"+l[2]+"</p><button id=play1 type=button>▶ استمع</button></section><section class=example><p class=ru>"+l[3]+"</p><p>"+l[4]+"</p><button id=play2 type=button>▶ استمع</button></section><h3>شرح الدرس</h3><p>"+window.LEXORA_NOTES[current].explanation+"</p><h3>"+l[5]+"</h3><div id=answers></div><p id=feedback aria-live=polite></p><h3>تدريب الكتابة</h3><p>"+window.LEXORA_NOTES[current].writingPrompt+"</p><input id=writing dir=ltr autocomplete=off placeholder='اكتب بالروسية هنا'><button id=checkWriting type=button style='margin-top:8px'>تصحيح الكتابة</button><p id=writingFeedback aria-live=polite></p><p class=meta>التسجيلات الطبيعية تعمل بعد توليد ورفع MP3. لا نستخدم صوت المتصفح الروبوتي.</p>";const play=(phrase)=>{const url=window.LEXORA_AUDIO?.[phrase];if(!url){main.querySelector("#feedback").textContent="التسجيل الطبيعي غير مرفوع بعد لهذه الجملة.";return;}new Audio(url).play().catch(()=>{main.querySelector("#feedback").textContent="تعذّر تشغيل الملف الصوتي.";});};main.querySelector("#play1").onclick=()=>play(l[1]);main.querySelector("#play2").onclick=()=>play(l[3]);main.querySelector("#checkWriting").onclick=()=>{const normalize=t=>t.trim().toLocaleLowerCase("ru").replace(/[.!?؟]/g,"").replace(/ё/g,"е").replace(/\s+/g," ");const typed=normalize(main.querySelector("#writing").value),expected=normalize(window.LEXORA_NOTES[current].writingAnswer);const ok=typed===expected;const el=main.querySelector("#writingFeedback");el.textContent=ok?"✓ ممتاز! الإجابة صحيحة.":"الإجابة النموذجية: "+window.LEXORA_NOTES[current].writingAnswer;el.className=ok?"ok":"bad";};const ans=main.querySelector("#answers"),correct=l[6],wrong=l[7];[correct,wrong].sort(()=>Math.random()-.5).forEach(v=>{let b=document.createElement("button");b.textContent=v;b.style.margin="5px";b.onclick=()=>{let good=v===correct;main.querySelector("#feedback").textContent=good?"✓ إجابة صحيحة. تم حفظ الإنجاز.":"✗ جرّب تاني. راجع الأمثلة فوق.";main.querySelector("#feedback").className=good?"ok":"bad";if(good){done.add(current);localStorage.setItem("lexoraA1done",JSON.stringify([...done]));document.querySelector("#progress").value=done.size;document.querySelector("#summary").textContent=done.size+" من 12 درسًا مكتملًا"}};ans.append(b)})}draw();
document.querySelector("#lessonsTab").onclick=()=>draw();
document.querySelector("#a2Tab").onclick=()=>showA2();
document.querySelector("#a2ReadingTab").onclick=()=>showA2Reading();
document.querySelector("#a2DialoguesTab").onclick=()=>showA2Dialogues();
document.querySelector("#a2ExamTab").onclick=()=>showA2Exam();
document.querySelector("#a2ListeningTab").onclick=()=>showA2Listening();
document.querySelector("#dashboardTab").onclick=()=>showDashboard();
document.querySelector("#readingTab").onclick=()=>showReading();
function showA2(){nav.innerHTML="";main.innerHTML="<h2>🚀 Russian A2 — المستوى المتوسط المبتدئ</h2><p>اختر درسًا من القائمة لبدء التعلّم.</p>";let completed;try{completed=new Set(JSON.parse(localStorage.getItem("lexoraA2done")||"[]"))}catch{completed=new Set()};const render=i=>{const l=window.LEXORA_A2[i];main.innerHTML="";const meta=document.createElement("p");meta.className="meta";meta.textContent="Russian / A2 / Lesson "+(i+1);main.append(meta);const h=document.createElement("h2");h.textContent=l.title;main.append(h);l.examples.forEach(ex=>{const section=document.createElement("section");section.className="example";const ru=document.createElement("p");ru.className="ru";ru.textContent=ex.ru;const ar=document.createElement("p");ar.textContent=ex.ar;section.append(ru,ar);const listen=document.createElement("button");listen.textContent="▶ استمع بالصوت الطبيعي";listen.onclick=()=>playA2Audio(ex.ru,listen);section.append(listen);main.append(section)});const explanation=document.createElement("p");explanation.textContent=l.explanation;main.append(explanation);const question=document.createElement("h3");question.textContent=l.question;main.append(question);const feedback=document.createElement("p");feedback.setAttribute("aria-live","polite");[l.correct,l.wrong].forEach(answer=>{const b=document.createElement("button");b.textContent=answer;b.style.margin="5px";b.onclick=()=>{const ok=answer===l.correct;feedback.textContent=ok?"✓ إجابة صحيحة":"✗ حاول مجددًا";feedback.className=ok?"ok":"bad";if(ok){completed.add(i);localStorage.setItem("lexoraA2done",JSON.stringify([...completed]));showA2Nav(i)}};main.append(b)});main.append(feedback);const wh=document.createElement("h3");wh.textContent="تدريب الكتابة";const prompt=document.createElement("p");prompt.textContent=l.writingPrompt;const input=document.createElement("input");input.id="a2Writing";input.dir="ltr";const check=document.createElement("button");check.id="a2Check";check.textContent="تصحيح الكتابة";const result=document.createElement("p");result.id="a2Feedback";result.setAttribute("aria-live","polite");check.onclick=()=>{const norm=t=>t.trim().toLocaleLowerCase("ru").replace(/[.!?؟]/g,"").replace(/ё/g,"е").replace(/\s+/g," ");const ok=norm(input.value)===norm(l.writingAnswer);result.textContent=ok?"✓ ممتاز!":"الإجابة النموذجية: "+l.writingAnswer;result.className=ok?"ok":"bad"};main.append(wh,prompt,input,check,result)};const showA2Nav=active=>{nav.innerHTML="";window.LEXORA_A2.forEach((l,i)=>{const b=document.createElement("button");b.textContent=(completed.has(i)?"✓ ":"")+(i+1)+". "+l.title;b.className=i===active?"active":"";b.onclick=()=>{showA2Nav(i);render(i)};nav.append(b)})};showA2Nav(0);render(0)}
function showDashboard(){nav.innerHTML="";main.innerHTML="<h2>📊 لوحة التقدم</h2><p>ملخص التقدم المحفوظ على هذا الجهاز. لا يتم إرسال البيانات إلى خادم.</p><div id=dashboardStats></div>";const groups=[["📚 دروس A1","lexoraA1done",lessons.length],["📖 قراءة A1","lexoraA1reading",window.LEXORA_READING.length],["🚀 دروس A2","lexoraA2done",window.LEXORA_A2.length],["📖 قراءة A2","lexoraA2reading",window.LEXORA_A2_READING.length],["💬 محادثات A2","lexoraA2dialogues",window.LEXORA_A2_DIALOGUES.length],["🎧 استماع A2","lexoraA2listening",window.LEXORA_A2_LISTENING.length]];const container=main.querySelector("#dashboardStats");groups.forEach(([label,key,total])=>{let indices=[];try{const data=JSON.parse(localStorage.getItem(key)||"[]");if(Array.isArray(data))indices=[...new Set(data.filter(x=>Number.isInteger(x)&&x>=0&&x<total))]}catch{}const section=document.createElement("section");section.className="example";const h=document.createElement("h3");h.textContent=label;const p=document.createElement("p");p.textContent=indices.length+" / "+total+" مكتمل";const bar=document.createElement("progress");bar.max=total;bar.value=indices.length;bar.setAttribute("aria-label",label);section.append(h,p,bar);container.append(section)});let exam=null;try{exam=JSON.parse(localStorage.getItem("lexoraA2exam")||"null")}catch{}const section=document.createElement("section");section.className="example";const h=document.createElement("h3");h.textContent="📝 آخر اختبار A2";const p=document.createElement("p");p.textContent=exam&&Number.isFinite(exam.score)&&exam.total===16?"النتيجة: "+exam.score+" / 16 — "+(exam.score>=12?"اجتياز اختبار المراجعة":"يحتاج مراجعة"):"لم يُؤدَّ الاختبار بعد";section.append(h,p);container.append(section)}
function showA2Listening(){nav.innerHTML="";main.innerHTML="<h2>🎧 اختبار الاستماع الروسي — A2</h2><p>شغّل الصوت، ثم اختر المعنى الصحيح. لا تظهر الجملة الروسية إلا إذا طلبت كشفها.</p><div id=a2Listening></div>";let saved;try{saved=new Set(JSON.parse(localStorage.getItem("lexoraA2listening")||"[]"))}catch{saved=new Set()};const holder=main.querySelector("#a2Listening");window.LEXORA_A2_LISTENING.forEach((item,i)=>{const section=document.createElement("section");section.className="example";const h=document.createElement("h3");h.textContent=(saved.has(i)?"✓ ":"")+(i+1)+". "+item.question;const play=document.createElement("button");play.textContent="▶ تشغيل التسجيل";play.onclick=()=>playA2Audio(item.phrase,play);const details=document.createElement("details");const summary=document.createElement("summary");summary.textContent="كشف الجملة الروسية";const ru=document.createElement("p");ru.className="ru";ru.textContent=item.phrase;details.append(summary,ru);section.append(h,play,details);const feedback=document.createElement("p");feedback.setAttribute("aria-live","polite");item.choices.forEach((choice,j)=>{const b=document.createElement("button");b.textContent=choice;b.style.margin="5px";b.onclick=()=>{const ok=j===item.correct;feedback.textContent=ok?"✓ فهم صحيح":"✗ حاول الاستماع مرة أخرى";feedback.className=ok?"ok":"bad";if(ok){saved.add(i);localStorage.setItem("lexoraA2listening",JSON.stringify([...saved]));h.textContent="✓ "+(i+1)+". "+item.question}};section.append(b)});section.append(feedback);holder.append(section)})}
function playA2Audio(phrase,button){const url=window.LEXORA_A2_AUDIO?.[phrase];if(!url){button.textContent="التسجيل الطبيعي قيد التجهيز";return}const audio=new Audio(url);audio.play().catch(()=>{button.textContent="تعذر تشغيل التسجيل"});}
function showA2Exam(){nav.innerHTML="";main.innerHTML="<h2>📝 اختبار مراجعة A2</h2><p>16 سؤالًا للمراجعة. نتيجة 12/16 أو أكثر تعني اجتياز هذا الاختبار التدريبي، وليست شهادة CEFR.</p><div id=a2Exam></div>";const holder=main.querySelector("#a2Exam");let answers={};window.LEXORA_A2_EXAM.forEach((q,i)=>{const section=document.createElement("section");section.className="example";const title=document.createElement("h3");title.textContent=(i+1)+". "+q.question;section.append(title);[q.correct,q.wrong].forEach((option,j)=>{const label=document.createElement("label");label.style.display="block";label.style.margin="8px 0";const input=document.createElement("input");input.type="radio";input.name="a2q"+i;input.value=option;input.style.width="auto";input.onchange=()=>{answers[i]=option};label.append(input,document.createTextNode(" "+option));section.append(label)});holder.append(section)});const submit=document.createElement("button");submit.id="a2ExamSubmit";submit.textContent="تصحيح الاختبار";const result=document.createElement("p");result.id="a2ExamResult";result.setAttribute("aria-live","polite");submit.onclick=()=>{if(Object.keys(answers).length!==window.LEXORA_A2_EXAM.length){result.textContent="أجب عن جميع الأسئلة أولًا ("+Object.keys(answers).length+"/16).";result.className="bad";return}const score=window.LEXORA_A2_EXAM.filter((q,i)=>answers[i]===q.correct).length;result.textContent="نتيجتك: "+score+"/16 — "+(score>=12?"اجتزت اختبار المراجعة!":"راجع الدروس ثم حاول مجددًا.");result.className=score>=12?"ok":"bad";try{localStorage.setItem("lexoraA2exam",JSON.stringify({score,total:16,completedAt:new Date().toISOString()}))}catch{}};main.append(submit,result)}
function showA2Dialogues(){nav.innerHTML="";main.innerHTML="<h2>💬 محادثات روسية — A2</h2><p>اقرأ الحوار ثم اختبر فهمك. الترجمات العربية قابلة للإظهار.</p><div id=a2Dialogues></div>";let saved;try{saved=new Set(JSON.parse(localStorage.getItem("lexoraA2dialogues")||"[]"))}catch{saved=new Set()};const holder=main.querySelector("#a2Dialogues");window.LEXORA_A2_DIALOGUES.forEach((d,i)=>{const section=document.createElement("section");section.className="example";const h=document.createElement("h3");h.textContent=(saved.has(i)?"✓ ":"")+(i+1)+". "+d.title;const context=document.createElement("p");context.textContent=d.context;section.append(h,context);d.turns.forEach(turn=>{const ru=document.createElement("p");ru.className="ru";ru.textContent=turn[0];const details=document.createElement("details");const summary=document.createElement("summary");summary.textContent="الترجمة العربية";const ar=document.createElement("p");ar.textContent=turn[1];details.append(summary,ar);section.append(ru,details);const listen=document.createElement("button");listen.textContent="▶ استمع";listen.onclick=()=>playA2Audio(turn[0],listen);section.append(listen)});const q=document.createElement("p");q.textContent=d.question;section.append(q);const feedback=document.createElement("p");feedback.setAttribute("aria-live","polite");d.choices.forEach((choice,j)=>{const b=document.createElement("button");b.textContent=choice;b.style.margin="5px";b.onclick=()=>{const ok=j===d.correct;feedback.textContent=ok?"✓ إجابة صحيحة":"✗ حاول مرة أخرى";feedback.className=ok?"ok":"bad";if(ok){saved.add(i);localStorage.setItem("lexoraA2dialogues",JSON.stringify([...saved]));h.textContent="✓ "+(i+1)+". "+d.title}};section.append(b)});section.append(feedback);holder.append(section)})}
function showA2Reading(){nav.innerHTML="";main.innerHTML="<h2>📖 مختبر القراءة الروسية — A2</h2><p>اقرأ النص ثم أجب عن سؤال الفهم. تقدمك محفوظ على هذا الجهاز.</p><div id=a2Passages></div>";let saved;try{saved=new Set(JSON.parse(localStorage.getItem("lexoraA2reading")||"[]"))}catch{saved=new Set()};const holder=main.querySelector("#a2Passages");window.LEXORA_A2_READING.forEach((p,i)=>{const section=document.createElement("section");section.className="example";const h=document.createElement("h3");h.textContent=(saved.has(i)?"✓ ":"")+(i+1)+". "+p.title;const ru=document.createElement("p");ru.className="ru";ru.textContent=p.text;const details=document.createElement("details");const summary=document.createElement("summary");summary.textContent="إظهار الترجمة العربية";const translation=document.createElement("p");translation.textContent=p.translation;details.append(summary,translation);const q=document.createElement("p");q.textContent=p.question;const feedback=document.createElement("p");feedback.setAttribute("aria-live","polite");section.append(h,ru,details,q);p.choices.forEach((choice,j)=>{const b=document.createElement("button");b.textContent=choice;b.style.margin="5px";b.onclick=()=>{const ok=j===p.correct;feedback.textContent=ok?"✓ فهم ممتاز!":"✗ حاول مرة أخرى.";feedback.className=ok?"ok":"bad";if(ok){saved.add(i);localStorage.setItem("lexoraA2reading",JSON.stringify([...saved]));h.textContent="✓ "+(i+1)+". "+p.title}};section.append(b)});section.append(feedback);holder.append(section)})}
function showReading(){nav.querySelectorAll("button").forEach(b=>b.classList.remove("active"));main.innerHTML="<h2>📖 مختبر القراءة الروسية — A1</h2><p>اقرأ النصوص القصيرة، ثم اختبر فهمك. الإجابات تحفظ على هذا الجهاز.</p><div id=passages></div>";const holder=main.querySelector("#passages");window.LEXORA_READING.forEach((passage,i)=>{const section=document.createElement("section");section.className="example";const h=document.createElement("h3");h.textContent=(readingDone.has(i)?"✓ ":"")+(i+1)+". "+passage.title;section.append(h);const text=document.createElement("p");text.className="ru";text.textContent=passage.text;section.append(text);const translation=document.createElement("details");const summary=document.createElement("summary");summary.textContent="إظهار الترجمة العربية";translation.append(summary);const t=document.createElement("p");t.textContent=passage.translation;translation.append(t);section.append(translation);const question=document.createElement("p");question.textContent=passage.question;section.append(question);const feedback=document.createElement("p");feedback.setAttribute("aria-live","polite");passage.choices.forEach((choice,j)=>{const btn=document.createElement("button");btn.textContent=choice;btn.style.margin="5px";btn.onclick=()=>{const ok=j===passage.correct;feedback.textContent=ok?"✓ فهم ممتاز!":"✗ راجع النص وحاول تاني.";feedback.className=ok?"ok":"bad";if(ok){readingDone.add(i);localStorage.setItem("lexoraA1reading",JSON.stringify([...readingDone]));h.textContent="✓ "+(i+1)+". "+passage.title}};section.append(btn)});section.append(feedback);holder.append(section)})}
</script></body></html>
