<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#121a32"><title>Lexora Academy | Russian A1</title><style>
:root{font-family:system-ui,"Segoe UI",sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0c1326;color:#eef2ff}header{padding:24px;background:#17213c;border-bottom:1px solid #344263}h1{margin:0;color:#89e8d0}small{color:#b4bed1}.layout{max-width:1100px;margin:auto;padding:22px;display:grid;grid-template-columns:275px 1fr;gap:20px}aside,main{border:1px solid #344263;background:#151f38;border-radius:18px;padding:20px}button{cursor:pointer;color:#fff;background:#283958;border:1px solid #405479;border-radius:10px;padding:11px 15px}button:hover,button.active{background:#287d75}nav button{display:block;width:100%;text-align:right;margin:8px 0}.ru{font-size:1.45rem;direction:ltr;text-align:left;color:#acf4db}.example{background:#202e4a;border-radius:12px;padding:15px;margin:12px 0}.example p{margin:7px 0}input{width:100%;padding:12px;background:#0e172d;color:white;border:1px solid #52617c;border-radius:9px}.ok{color:#7ce2aa}.bad{color:#ffaeae}.meta{color:#b8c4dc}progress{width:100%}@media(max-width:720px){.layout{grid-template-columns:1fr}header{padding:18px}} </style></head>
<body><header><h1>LEXORA <span style="color:white">ACADEMY</span></h1><small>الروسية • المستوى A1 • نسخة البداية على GitHub</small></header><div class="layout"><aside><h2>الدروس</h2><progress id="progress" value="0" max="12"></progress><p id="summary"></p><nav id="nav"></nav></aside><main id="lesson"></main></div>
<script src="neural-audio.js"></script><script src="curriculum/a1-notes.js"></script><script>
const lessons=[
["التحية والتعارف","Привет!","مرحبًا!","Здравствуйте!","أهلًا (رسميًا)","اختر التحية الرسمية","Здравствуйте!","Привет!"],
["الأسماء والتقديم","Меня зовут Анна.","اسمي آنا","Как вас зовут?","ما اسم حضرتك؟","كيف تقول: اسمي آنا؟","Меня зовут Анна.","До свидания."],
["الشكر والاعتذار","Спасибо!","شكرًا!","Извините.","اعذرني / آسف","ما معنى شكرًا؟","Спасибо!","Извините."],
["نعم ولا","Да.","نعم","Нет.","لا","ما معنى لا؟","Нет.","Да."],
["الضمائر","Я студент.","أنا طالب","Вы инженер.","حضرتك مهندس","أي ضمير يعني أنا؟","Я","Вы"],
["البلدان واللغات","Я из Египта.","أنا من مصر","Я говорю по-русски.","أنا أتحدث الروسية","كيف تقول: أنا من مصر؟","Я из Египта.","Я из России."],
["الأرقام الأساسية","Один, два, три.","واحد، اثنان، ثلاثة","Десять.","عشرة","ما معنى عشرة؟","Десять.","Один."],
["الأسئلة البسيطة","Где метро?","أين المترو؟","Что это?","ما هذا؟","كيف تسأل أين المترو؟","Где метро?","Что это?"],
["العائلة","Это моя мама.","هذه أمي","Это мой брат.","هذا أخي","ما معنى هذا أخي؟","Это мой брат.","Это моя мама."],
["الطعام والطلب","Я хочу чай.","أريد شايًا","Можно воду?","هل يمكن ماء؟","كيف تطلب الشاي؟","Я хочу чай.","Я хочу кофе."],
["الوقت واليوم","Сегодня понедельник.","اليوم الاثنين","Сейчас два часа.","الساعة الآن الثانية","ما معنى اليوم؟","Сегодня","Вчера"],
["التسوق والسعر","Сколько это стоит?","بكم هذا؟","Это дорого.","هذا غالٍ","كيف تسأل عن السعر؟","Сколько это стоит?","Где метро?"]
];
const nav=document.querySelector("#nav"),main=document.querySelector("#lesson");let current=0,done;try{done=new Set(JSON.parse(localStorage.getItem("lexoraA1done")||"[]"))}catch{done=new Set()}
function draw(){nav.innerHTML="";lessons.forEach((l,i)=>{let b=document.createElement("button");b.textContent=(done.has(i)?"✓ ":"")+(i+1)+". "+l[0];b.className=i===current?"active":"";b.onclick=()=>{current=i;draw()};nav.append(b)});document.querySelector("#progress").value=done.size;document.querySelector("#summary").textContent=done.size+" من 12 درسًا مكتملًا";let l=lessons[current];main.innerHTML="<p class=meta>Russian / A1 / Lesson "+(current+1)+"</p><h2>"+l[0]+"</h2><p>اقرأ الأمثلة، افهم الترجمة، ثم حل سؤال المراجعة.</p><section class=example><p class=ru>"+l[1]+"</p><p>"+l[2]+"</p><button id=play1 type=button>▶ استمع</button></section><section class=example><p class=ru>"+l[3]+"</p><p>"+l[4]+"</p><button id=play2 type=button>▶ استمع</button></section><h3>شرح الدرس</h3><p>"+window.LEXORA_NOTES[current].explanation+"</p><h3>"+l[5]+"</h3><div id=answers></div><p id=feedback aria-live=polite></p><h3>تدريب الكتابة</h3><p>"+window.LEXORA_NOTES[current].writingPrompt+"</p><input id=writing dir=ltr autocomplete=off placeholder="اكتب بالروسية هنا"><button id=checkWriting type=button style="margin-top:8px">تصحيح الكتابة</button><p id=writingFeedback aria-live=polite></p><p class=meta>التسجيلات الطبيعية تعمل بعد توليد ورفع MP3. لا نستخدم صوت المتصفح الروبوتي.</p>";const play=(phrase)=>{const url=window.LEXORA_AUDIO?.[phrase];if(!url){main.querySelector("#feedback").textContent="التسجيل الطبيعي غير مرفوع بعد لهذه الجملة.";return;}new Audio(url).play().catch(()=>{main.querySelector("#feedback").textContent="تعذّر تشغيل الملف الصوتي.";});};main.querySelector("#play1").onclick=()=>play(l[1]);main.querySelector("#play2").onclick=()=>play(l[3]);main.querySelector("#checkWriting").onclick=()=>{const normalize=t=>t.trim().toLocaleLowerCase("ru").replace(/[.!?؟]/g,"").replace(/ё/g,"е").replace(/\s+/g," ");const typed=normalize(main.querySelector("#writing").value),expected=normalize(window.LEXORA_NOTES[current].writingAnswer);const ok=typed===expected;const el=main.querySelector("#writingFeedback");el.textContent=ok?"✓ ممتاز! الإجابة صحيحة.":"الإجابة النموذجية: "+window.LEXORA_NOTES[current].writingAnswer;el.className=ok?"ok":"bad";};const ans=main.querySelector("#answers"),correct=l[6],wrong=l[7];[correct,wrong].sort(()=>Math.random()-.5).forEach(v=>{let b=document.createElement("button");b.textContent=v;b.style.margin="5px";b.onclick=()=>{let good=v===correct;main.querySelector("#feedback").textContent=good?"✓ إجابة صحيحة. تم حفظ الإنجاز.":"✗ جرّب تاني. راجع الأمثلة فوق.";main.querySelector("#feedback").className=good?"ok":"bad";if(good){done.add(current);localStorage.setItem("lexoraA1done",JSON.stringify([...done]));document.querySelector("#progress").value=done.size;document.querySelector("#summary").textContent=done.size+" من 12 درسًا مكتملًا"}};ans.append(b)})}draw();
</script></body></html>
