function showA2(){nav.innerHTML="";main.innerHTML="<h2>🚀 Russian A2 — المستوى المتوسط المبتدئ</h2><p>اختر درسًا من القائمة لبدء التعلّم.</p>";let completed;try{completed=new Set(JSON.parse(localStorage.getItem("lexoraA2done")||"[]"))}catch{completed=new Set()};const render=i=>{const l=window.LEXORA_A2[i];main.innerHTML="";const meta=document.createElement("p");meta.className="meta";meta.textContent="Russian / A2 / Lesson "+(i+1);main.append(meta);const h=document.createElement("h2");h.textContent=l.title;main.append(h);l.examples.forEach(ex=>{const section=document.createElement("section");section.className="example";const ru=document.createElement("p");ru.className="ru";ru.textContent=ex.ru;const ar=document.createElement("p");ar.textContent=ex.ar;section.append(ru,ar);const listen=document.createElement("button");listen.textContent=""+(localStorage.getItem("lexoraLanguage")==="ar"?"▶ استمع":"▶ Listen")+" بالصوت الطبيعي";listen.onclick=()=>playA2Audio(ex.ru,listen);section.append(listen);main.append(section)});const explanation=document.createElement("p");explanation.textContent=l.explanation;main.append(explanation);const question=document.createElement("h3");question.textContent=l.question;main.append(question);const feedback=document.createElement("p");feedback.setAttribute("aria-live","polite");[l.correct,l.wrong].forEach(answer=>{const b=document.createElement("button");b.textContent=answer;b.style.margin="5px";b.onclick=()=>{const ok=answer===l.correct;feedback.textContent=ok?"✓ إجابة صحيحة":"✗ حاول مجددًا";feedback.className=ok?"ok":"bad";if(ok){completed.add(i);localStorage.setItem("lexoraA2done",JSON.stringify([...completed]));showA2Nav(i)}};main.append(b)});main.append(feedback);const wh=document.createElement("h3");wh.textContent=""+(localStorage.getItem("lexoraLanguage")==="ar"?"تدريب الكتابة":"Writing practice")+"";const prompt=document.createElement("p");prompt.textContent=l.writingPrompt;const input=document.createElement("input");input.id="a2Writing function showBackup(){nav.innerHTML="";main.innerHTML="<h2>💾 نسخ واستعادة التقدم</h2><p>البيانات محفوظة محليًا على هذا الجهاز. يمكنك تصدير ملف JSON واستعادته على جهاز آخر. الاستعادة تستبدل تقدم الأقسام الموجودة في الملف بعد تأكيدك.</p>";const exportButton=document.createElement("button");exportButton.id="backupExport";exportButton.textContent="⬇ تصدير نسخة احتياطية";exportButton.onclick=()=>{const data={format:"lexora-progress",version:1,exportedAt:new Date().toISOString(),progress:{}};LEXORA_PROGRESS_KEYS.forEach(key=>{const raw=localStorage.getItem(key);if(raw!==null){try{data.progress[key]=JSON.parse(raw)}catch{}}});const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="lexora-progress.json";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)};const input=document.createElement("input");input.type="file";input.id="backupImport";input.accept=".json,application/json";input.style.marginTop="14px";const restore=document.createElement("button");restore.id="backupRestore";restore.textContent="⬆ استعادة الملف المختار";const feedback=document.createElement("p");feedback.id="backupFeedback";feedback.setAttribute("aria-live","polite");restore.onclick=async()=>{const file=input.files?.[0];if(!file){feedback.textContent="اختر ملف JSON أولًا";return}try{if(file.size>100000){throw Error("الملف كبير جدًا")}const data=JSON.parse(await file.text());if(data?.format!=="lexora-progress"||data.version!==1||!data.progress||typeof data.progress!=="object"||Array.isArray(data.progress))throw Error("صيغة الملف غير مدعومة");const entries=Object.entries(data.progress);if(!entries.length||entries.some(([key,value])=>!LEXORA_PROGRESS_KEYS.includes(key)||!validateLexoraProgress(key,value)))throw Error("بيانات التقدم غير صالحة");if(!confirm("سيتم استبدال تقدم الأقسام الموجودة في الملف على هذا الجهاز. هل تريد المتابعة؟"))return;entries.forEach(([key,value])=>localStorage.setItem(key,JSON.stringify(value)));feedback.textContent="✓ تمت الاستعادة. حدّث الصفحة لرؤية التقدم في جميع الأقسام.";feedback.className="ok"}catch(err){feedback.textContent="تعذر الاستعادة: "+err.message;feedback.className="bad"}};main.append(exportButton,input,restore,feedback)}
function validateLexoraProgress(key,value){if(key==="lexoraA2exam")return value&&typeof value==="object"&&!Array.isArray(value)&&Number.isInteger(value.score)&&value.score>=0&&value.score<=16&&value.total===16;return Array.isArray(value)&&value.length<=1000&&value.every(x=>Number.isInteger(x)&&x>=0&&x<1000)}
function showDashboard(){nav.innerHTML="";main.innerHTML="<h2>📊 لوحة التقدم</h2><p>ملخص التقدم المحفوظ على هذا الجهاز. لا يتم إرسال البيانات إلى خادم.</p><div id=dashboardStats></div>";const groups=[["📚 دروس A1","lexoraA1done",lessons.length],["📖 قراءة A1","lexoraA1reading",window.LEXORA_READING.length],["🚀 دروس A2","lexoraA2done",window.LEXORA_A2.length],["📖 قراءة A2","lexoraA2reading",window.LEXORA_A2_READING.length],["💬 محادثات A2","lexoraA2dialogues",window.LEXORA_A2_DIALOGUES.length],["🎧 استماع A2","lexoraA2listening",window.LEXORA_A2_LISTENING.length]];const container=main.querySelector("#dashboardStats");groups.forEach(([label,key,total])=>{let indices=[];try{const data=JSON.parse(localStorage.getItem(key)||"[]");if(Array.isArray(data))indices=[...new Set(data.filter(x=>Number.isInteger(x)&&x>=0&&x<total))]}catch{}const section=document.createElement("section");section.className="example";const h=document.createElement("h3");h.textContent=label;const p=document.createElement("p");p.textContent=indices.length+" / "+total+" مكتمل";const bar=document.createElement("progress");bar.max=total;bar.value=indices.length;bar.setAttribute("aria-label",label);section.append(h,p,bar);container.append(section)});let exam=null;try{exam=JSON.parse(localStorage.getItem("lexoraA2exam")||"null")}catch{}const section=document.createElement("section");section.className="example";const h=document.createElement("h3");h.textContent="📝 آخر اختبار A2";const p=document.createElement("p");p.textContent=exam&&Number.isFinite(exam.score)&&exam.total===16?"النتيجة: "+exam.score+" / 16 — "+(exam.score>=12?"اجتياز اختبار المراجعة":"يحتاج مراجعة"):"لم يُؤدَّ الاختبار بعد";section.append(h,p);container.append(section)}
function showA2Listening(){nav.innerHTML="";main.innerHTML="<h2>🎧 اختبار الاستماع الروسي — A2</h2><p>شغّل الصوت، ثم اختر المعنى الصحيح. لا تظهر الجملة الروسية إلا إذا طلبت كشفها.</p><div id=a2Listening></div>";let saved;try{saved=new Set(JSON.parse(localStorage.getItem("lexoraA2listening")||"[]"))}catch{saved=new Set()};const holder=main.querySelector("#a2Listening");window.LEXORA_A2_LISTENING.forEach((item,i)=>{const section=document.createElement("section");section.className="example";const h=document.createElement("h3");h.textContent=(saved.has(i)?"✓ ":"")+(i+1)+". "+item.question;const play=document.createElement("button");play.textContent="▶ تشغيل التسجيل";play.onclick=()=>playA2Audio(item.phrase,play);const details=document.createElement("details");const summary=document.createElement("summary");summary.textContent="كشف الجملة الروسية";const ru=document.createElement("p");ru.className="ru";ru.textContent=item.phrase;details.append(summary,ru);section.append(h,play,details);const feedback=document.createElement("p");feedback.setAttribute("aria-live","polite");item.choices.forEach((choice,j)=>{const b=document.createElement("button");b.textContent=choice;b.style.margin="5px";b.onclick=()=>{const ok=j===item.correct;feedback.textContent=ok?"✓ فهم صحيح":"✗ حاول الاستماع مرة أخرى";feedback.className=ok?"ok":"bad";if(ok){saved.add(i);localStorage.setItem("lexoraA2listening",JSON.stringify([...saved]));h.textContent="✓ "+(i+1)+". "+item.question}};section.append(b)});section.append(feedback);holder.append(section)})}
function playA2Audio(phrase,button){const url=window.LEXORA_A2_AUDIO?.[phrase];if(!url){button.textContent="التسجيل الطبيعي قيد التجهيز";return}const audio=new Audio(url);audio.play().catch(()=>{button.textContent="تعذر تشغيل التسجيل"});}
function showA2Exam(){nav.innerHTML="";main.innerHTML="<h2>📝 اختبار مراجعة A2</h2><p>16 سؤالًا للمراجعة. نتيجة 12/16 أو أكثر تعني اجتياز هذا الاختبار التدريبي، وليست شهادة CEFR.</p><div id=a2Exam></div>";const holder=main.querySelector("#a2Exam");let answers={};window.LEXORA_A2_EXAM.forEach((q,i)=>{const section=document.createElement("section");section.className="example";const title=document.createElement("h3");title.textContent=(i+1)+". "+q.question;section.append(title);(i%2===0?[q.wrong,q.correct]:[q.correct,q.wrong]).forEach((option,j)=>{const label=document.createElement("label");label.style.display="block";label.style.margin="8px 0";const input=document.createElement("input");input.type="radio";input.name="a2q"+i;input.value=option;input.style.width="auto";input.onchange=()=>{answers[i]=option};label.append(input,document.createTextNode(" "+option));section.append(label)});holder.append(section)});const submit=document.createElement("button");submit.id="a2ExamSubmit";submit.textContent="تصحيح الاختبار";const result=document.createElement("p");result.id="a2ExamResult";result.setAttribute("aria-live","polite");submit.onclick=()=>{if(Object.keys(answers).length!==window.LEXORA_A2_EXAM.length){result.textContent="أجب عن جميع الأسئلة أولًا ("+Object.keys(answers).length+"/16).";result.className="bad";return}const score=window.LEXORA_A2_EXAM.filter((q,i)=>answers[i]===q.correct).length;result.textContent="نتيجتك: "+score+"/16 — "+(score>=12?"اجتزت اختبار المراجعة!":"راجع الدروس ثم حاول مجددًا.");result.className=score>=12?"ok":"bad";let review=main.querySelector("#a2ExamReview");if(!review){review=document.createElement("section");review.id="a2ExamReview";review.className="example";main.append(review)}review.replaceChildren();const heading=document.createElement("h3");const mistakes=window.LEXORA_A2_EXAM.map((q,i)=>({q,i})).filter(({q,i})=>answers[i]!==q.correct);heading.textContent=mistakes.length?"راجع "+mistakes.length+" إجابة غير صحيحة":"✓ جميع الإجابات صحيحة";review.append(heading);mistakes.forEach(({q,i})=>{const item=document.createElement("p");const title=document.createElement("strong");title.textContent=(i+1)+". "+q.question;const selected=document.createElement("span");selected.textContent=" — إجابتك: "+answers[i]+" | الصحيح: "+q.correct;item.append(title,selected);review.append(item)});try{localStorage.setItem("lexoraA2exam",JSON.stringify({score,total:16,completedAt:new Date().toISOString()}))}catch{}};main.append(submit,result)}
function showA2Dialogues(){nav.innerHTML="";main.innerHTML="<h2>💬 محادثات روسية — A2</h2><p>اقرأ الحوار ثم اختبر فهمك. الترجمات العربية قابلة للإظهار.</p><div id=a2Dialogues></div>";let saved;try{saved=new Set(JSON.parse(localStorage.getItem("lexoraA2dialogues")||"[]"))}catch{saved=new Set()};const holder=main.querySelector("#a2Dialogues");window.LEXORA_A2_DIALOGUES.forEach((d,i)=>{const section=document.createElement("section");section.className="example";const h=document.createElement("h3");h.textContent=(saved.has(i)?"✓ ":"")+(i+1)+". "+d.title;const context=document.createElement("p");context.textContent=d.context;section.append(h,context);d.turns.forEach(turn=>{const ru=document.createElement("p");ru.className="ru";ru.textContent=turn[0];const details=document.createElement("details");const summary=document.createElement("summary");summary.textContent="الترجمة العربية";const ar=document.createElement("p");ar.textContent=turn[1];details.append(summary,ar);section.append(ru,details);const listen=document.createElement("button");listen.textContent=""+(localStorage.getItem("lexoraLanguage")==="ar"?"▶ استمع":"▶ Listen")+"";listen.onclick=()=>playA2Audio(turn[0],listen);section.append(listen)});const q=document.createElement("p");q.textContent=d.question;section.append(q);const feedback=document.createElement("p");feedback.setAttribute("aria-live","polite");d.choices.forEach((choice,j)=>{const b=document.createElement("button");b.textContent=choice;b.style.margin="5px";b.onclick=()=>{const ok=j===d.correct;feedback.textContent=ok?"✓ إجابة صحيحة":"✗ حاول مرة أخرى";feedback.className=ok?"ok":"bad";if(ok){saved.add(i);localStorage.setItem("lexoraA2dialogues",JSON.stringify([...saved]));h.textContent="✓ "+(i+1)+". "+d.title}};section.append(b)});section.append(feedback);holder.append(section)})}
function showA2Reading(){nav.innerHTML="";main.innerHTML="<h2>📖 مختبر القراءة الروسية — A2</h2><p>اقرأ النص ثم أجب عن سؤال الفهم. تقدمك محفوظ على هذا الجهاز.</p><div id=a2Passages></div>";let saved;try{saved=new Set(JSON.parse(localStorage.getItem("lexoraA2reading")||"[]"))}catch{saved=new Set()};const holder=main.querySelector("#a2Passages");window.LEXORA_A2_READING.forEach((p,i)=>{const section=document.createElement("section");section.className="example";const h=document.createElement("h3");h.textContent=(saved.has(i)?"✓ ":"")+(i+1)+". "+p.title;const ru=document.createElement("p");ru.className="ru";ru.textContent=p.text;const details=document.createElement("details");const summary=document.createElement("summary");summary.textContent="إظهار الترجمة العربية";const translation=document.createElement("p");translation.textContent=p.translation;details.append(summary,translation);const q=document.createElement("p");q.textContent=p.question;const feedback=document.createElement("p");feedback.setAttribute("aria-live","polite");section.append(h,ru,details,q);p.choices.forEach((choice,j)=>{const b=document.createElement("button");b.textContent=choice;b.style.margin="5px";b.onclick=()=>{const ok=j===p.correct;feedback.textContent=ok?"✓ فهم ممتاز!":"✗ حاول مرة أخرى.";feedback.className=ok?"ok":"bad";if(ok){saved.add(i);localStorage.setItem("lexoraA2reading",JSON.stringify([...saved]));h.textContent="✓ "+(i+1)+". "+p.title}};section.append(b)});section.append(feedback);holder.append(section)})}
function showReading(){nav.querySelectorAll("button").forEach(b=>b.classList.remove("active"));main.innerHTML="<h2>📖 مختبر القراءة الروسية — A1</h2><p>اقرأ النصوص القصيرة، ثم اختبر فهمك. الإجابات تحفظ على هذا الجهاز.</p><div id=passages></div>";const holder=main.querySelector("#passages");window.LEXORA_READING.forEach((passage,i)=>{const section=document.createElement("section");section.className="example";const h=document.createElement("h3");h.textContent=(readingDone.has(i)?"✓ ":"")+(i+1)+". "+passage.title;section.append(h);const text=document.createElement("p");text.className="ru";text.textContent=passage.text;section.append(text);const translation=document.createElement("details");const summary=document.createElement("summary");summary.textContent="إظهار الترجمة العربية";translation.append(summary);const t=document.createElement("p");t.textContent=passage.translation;translation.append(t);section.append(translation);const question=document.createElement("p");question.textContent=passage.question;section.append(question);const feedback=document.createElement("p");feedback.setAttribute("aria-live","polite");passage.choices.forEach((choice,j)=>{const btn=document.createElement("button");btn.textContent=choice;btn.style.margin="5px";btn.onclick=()=>{const ok=j===passage.correct;feedback.textContent=ok?"✓ فهم ممتاز!":"✗ راجع النص وحاول تاني.";feedback.className=ok?"ok":"bad";if(ok){readingDone.add(i);localStorage.setItem("lexoraA1reading",JSON.stringify([...readingDone]));h.textContent="✓ "+(i+1)+". "+passage.title}};section.append(btn)});section.append(feedback);holder.append(section)})}
</script><script src="scripts/academy-home.js"></script><script src="scripts/visual-vocabulary.js"></script></body></html>
