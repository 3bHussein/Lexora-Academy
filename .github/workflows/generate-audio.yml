name: Generate Russian neural audio
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free neural TTS
        run: python -m pip install -r requirements-audio.txt
      - name: Generate natural Russian MP3
        run: python scripts/generate_audio.py
      - name: Validate generated audio
        run: |
          python - <<'PY'
          from pathlib import Path
          files = list(Path('audio/neural').glob('*.mp3'))
          assert len(files) == 24, f'Expected 24 MP3s, got {len(files)}'
          assert all(p.stat().st_size > 1000 for p in files)
          assert 'a1-024.mp3' in Path('neural-audio.js').read_text()
          print('Validated', len(files), 'audio recordings')
          PY
      - name: Commit audio to Pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/neural neural-audio.js
          git diff --cached --quiet || (git commit -m "Publish 24 Russian neural audio lessons" && git push)
