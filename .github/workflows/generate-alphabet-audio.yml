name: Generate Russian alphabet neural audio
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install neural speech engine
        run: python -m pip install -r requirements-audio.txt
      - name: Generate 33 Russian letter recordings
        run: python scripts/generate_alphabet_audio.py
      - name: Validate generated MP3 recordings
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          raw = Path("alphabet-neural-audio.js").read_text(encoding="utf-8")
          manifest = json.loads(raw.removeprefix("window.LEXORA_ALPHABET_AUDIO = ").rstrip(";\n "))
          assert len(manifest) == 33
          for path in manifest.values():
              file = Path(path)
              assert file.exists() and file.stat().st_size > 1000, path
          PY
      - name: Commit audio files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/neural/letter-*.mp3 alphabet-neural-audio.js
          git diff --cached --quiet || (git commit -m "Publish natural Russian alphabet audio" && git push)
