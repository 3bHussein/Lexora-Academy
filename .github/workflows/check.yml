name: Validate academy
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source files
        run: |
          python -m py_compile scripts/generate_audio.py
          python - <<'PY'
          from pathlib import Path
          assert Path('index.html').exists()
          assert Path('requirements-audio.txt').exists()
          assert 'Lexora' in Path('index.html').read_text(encoding='utf-8')
          print('Source checks passed')
          PY
